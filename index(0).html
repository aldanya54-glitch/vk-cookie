<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Cookie Master</title>
<style>
  :root{
    --bg:#0a0d12; --card:#171a21; --line:#232833;
    --txt:#e6e8ee; --muted:#8a93a6; --accent:#4f8cff; --accent2:#6ea8ff;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
    --shadow:0 10px 40px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background: radial-gradient(1200px 600px at 50% -10%, #1a2230 0%, var(--bg) 60%);
    color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:18px;
  }

  .login-screen{
    width:100%; max-width:380px;
    background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:32px 24px;
    box-shadow:var(--shadow); animation:fadeIn .4s ease;
  }
  .login-screen h1{
    text-align:center; font-size:22px; margin-bottom:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    font-weight:800;
  }
  .login-screen .sub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:24px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:500}
  .field input{
    width:100%; background:#0d0f14; border:1px solid var(--line);
    color:var(--txt); padding:13px 14px; border-radius:11px;
    font-size:14px; outline:none; transition:.2s; font-family:inherit;
  }
  .field input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  .btn-primary{
    width:100%; background:linear-gradient(135deg,var(--accent),#3a6fd8);
    color:#fff; border:none; padding:14px; border-radius:11px;
    font-size:15px; font-weight:700; cursor:pointer; transition:.2s;
    font-family:inherit; margin-top:6px;
  }
  .btn-primary:hover{filter:brightness(1.1); transform:translateY(-1px)}
  .btn-primary:disabled{opacity:.6; cursor:not-allowed; transform:none}
  .error-msg{color:var(--err); font-size:12px; text-align:center; margin-top:12px; min-height:16px}

  .app-screen{width:100%; max-width:520px; display:none; flex-direction:column; min-height:calc(100vh - 36px); animation:fadeIn .4s ease}
  .app-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding:0 4px}
  .app-header h1{
    font-size:20px; font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .user-info{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted)}
  .btn-logout{
    background:#222836; color:var(--txt); border:1px solid var(--line);
    padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer;
    font-family:inherit; transition:.2s;
  }
  .btn-logout:hover{background:#2c3342}

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:16px; margin-bottom:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
  }
  .card label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px; font-weight:500}
  .card input[type=text], .card textarea{
    width:100%; background:#0d0f14; border:1px solid var(--line);
    color:var(--txt); padding:12px 14px; border-radius:10px;
    font-size:14px; outline:none; transition:.2s; font-family:inherit;
  }
  .card textarea{
    min-height:140px; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:13px; line-height:1.5;
  }
  .card input:focus, .card textarea:focus{
    border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,140,255,.15);
  }
  .row{display:flex; gap:8px}
  .row input{flex:1}
  .btn-icon{
    background:#222836; color:var(--txt); border:1px solid var(--line);
    padding:12px 16px; border-radius:10px; font-size:16px;
    cursor:pointer; transition:.2s; flex-shrink:0;
  }
  .btn-icon:hover{background:#2c3342}
  .dir-info{
    font-size:12px; color:var(--muted); margin-top:10px;
    padding:8px 10px; background:#0d0f14; border-radius:8px;
    border:1px solid var(--line); word-break:break-all; line-height:1.6;
  }
  .dir-info strong{color:var(--ok); font-weight:600}
  .dir-info .path{font-family:ui-monospace,monospace; color:var(--accent)}
  .dir-info.warn{color:var(--warn)}
  .dir-info.warn strong{color:var(--warn)}

  .privacy-note{
    font-size:11px; color:var(--ok);
    background:rgba(34,197,94,.08);
    border:1px solid rgba(34,197,94,.3);
    border-radius:8px; padding:8px 10px;
    margin-top:10px; text-align:center;
  }

  .status-bar{
    margin-top:auto; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center;
    gap:10px; font-size:13px;
  }
  .status-bar .txt{
    flex:1; color:var(--muted); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .status-bar .badge{
    font-size:11px; padding:4px 10px; border-radius:999px;
    background:#1e2431; color:var(--muted); flex-shrink:0; font-weight:600;
  }
  .badge.ok{background:rgba(34,197,94,.15); color:var(--ok)}
  .badge.warn{background:rgba(245,158,11,.15); color:var(--warn)}
  .badge.err{background:rgba(239,68,68,.15); color:var(--err)}

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#1e2431; color:var(--txt);
    padding:12px 20px; border-radius:12px; font-size:13px;
    box-shadow:var(--shadow); transition:.35s cubic-bezier(.4,0,.2,1);
    opacity:0; z-index:1000; max-width:90vw; border:1px solid var(--line);
  }
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1}
  .toast.ok{border-color:var(--ok); color:var(--ok)}
  .toast.err{border-color:var(--err); color:var(--err)}
  .toast.warn{border-color:var(--warn); color:var(--warn)}

  @keyframes fadeIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <h1>🍪 VK Cookie Master</h1>
  <p class="sub">سجّل دخولك للمتابعة</p>
  <div class="field">
    <label>اسم المستخدم</label>
    <input type="text" id="username" autocomplete="off" placeholder="اسم المستخدم">
  </div>
  <div class="field">
    <label>كلمة المرور</label>
    <input type="password" id="password" autocomplete="off" placeholder="••••••••">
  </div>
  <button class="btn-primary" id="loginBtn">دخول</button>
  <div class="error-msg" id="loginError"></div>
</div>

<div class="app-screen" id="appScreen">
  <div class="app-header">
    <h1>🍪 VK Cookie Master</h1>
    <div class="user-info">
      <span id="userLabel">👤</span>
      <button class="btn-logout" id="logoutBtn">خروج</button>
    </div>
  </div>

  <div class="card">
    <label>اسم المجلد الحافظ</label>
    <div class="row">
      <input type="text" id="folderName" value="Vk" placeholder="Vk">
      <button class="btn-icon" id="pickDirBtn" title="اختيار مجلد">📁</button>
    </div>
    <div class="dir-info" id="dirInfo">لم يتم اختيار مجلد بعد</div>
    <div class="privacy-note">🔒 الكوكيز لا تُرسل لأي سيرفر — تُحفظ فقط على جهازك</div>
  </div>

  <div class="card">
    <label>أدخل كود الكوكيز المفكوك</label>
    <textarea id="cookieInput" placeholder="... أدخل الكود هنا"></textarea>
  </div>

  <div class="card">
    <button class="btn-primary" id="saveBtn">💾 استخراج وحفظ الملف تلقائياً</button>
  </div>

  <div class="status-bar">
    <span class="txt" id="statusText">جاهز للتصدير</span>
    <span class="badge" id="statusBadge">idle</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  // ============================================================
  //  بيانات الدخول
  // ============================================================
  const USERS = {
    "ltzsy": "amaramar"
  };

  // ============================================================
  //  إعداد اسم الملف
  // ============================================================
  // البادئة الثابتة (يمكن تغييرها من حقل "اسم المجلد الحافظ")
  // الناتج: Vk.cookies1.json, Vk.cookies2.json, ...
  const DEFAULT_PREFIX = "Vk";

  const $ = id => document.getElementById(id);
  const loginScreen = $("loginScreen");
  const appScreen   = $("appScreen");
  const usernameIn  = $("username");
  const passwordIn  = $("password");
  const loginBtn    = $("loginBtn");
  const loginError  = $("loginError");
  const logoutBtn   = $("logoutBtn");
  const userLabel   = $("userLabel");
  const folderInput = $("folderName");
  const pickDirBtn  = $("pickDirBtn");
  const dirInfo     = $("dirInfo");
  const cookieInput = $("cookieInput");
  const saveBtn     = $("saveBtn");
  const statusText  = $("statusText");
  const statusBadge = $("statusBadge");
  const toastEl     = $("toast");

  let dirHandle = null;
  const KEY_DIR     = "vk_dir_handle";
  const KEY_COUNTER = "vk_cookie_counter";
  const DB_NAME     = "vkcookie-db";
  const DB_STORE    = "handles";
  const hasDirPicker = () => typeof window.showDirectoryPicker === "function";

  let toastTimer = null;
  function toast(msg, type = "") {
    toastEl.textContent = msg;
    toastEl.className = "toast show " + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = "toast " + type; }, 3200);
  }

  function setStatus(text, kind = "idle") {
    statusText.textContent = text;
    statusBadge.textContent = kind;
    statusBadge.className = "badge " +
      (kind === "ok" ? "ok" : kind === "warn" ? "warn" : kind === "err" ? "err" : "");
  }

  function openDB() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
  }
  async function idbSet(k, v) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(v, k);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }
  async function idbGet(k) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const r = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(k);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }

  // ============================================================
  //  الدخول
  // ============================================================
  function tryLogin() {
    loginError.textContent = "";
    const u = usernameIn.value.trim();
    const p = passwordIn.value;

    if (!u || !p) {
      loginError.textContent = "أدخل اسم المستخدم وكلمة المرور";
      return;
    }

    if (USERS[u] && USERS[u] === p) {
      userLabel.textContent = "👤 " + u;
      loginScreen.style.display = "none";
      appScreen.style.display = "flex";
      initApp();
      return;
    }

    loginError.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة";
    passwordIn.value = "";
    passwordIn.focus();
  }

  loginBtn.addEventListener("click", tryLogin);
  passwordIn.addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
  usernameIn.addEventListener("keydown", e => { if (e.key === "Enter") passwordIn.focus(); });

  logoutBtn.addEventListener("click", () => {
    dirHandle = null;
    usernameIn.value = "";
    passwordIn.value = "";
    loginError.textContent = "";
    loginScreen.style.display = "block";
    appScreen.style.display = "none";
    setStatus("جاهز للتصدير", "idle");
  });

  // ============================================================
  //  اختيار المجلد
  // ============================================================
  async function ensurePermission(h, mode = "readwrite") {
    if ((await h.queryPermission({ mode })) === "granted") return true;
    return (await h.requestPermission({ mode })) === "granted";
  }

  async function pickDirectory() {
    if (!hasDirPicker()) {
      toast("⚠️ اختيار المجلد غير مدعوم — سيُستخدم التنزيل العادي", "warn");
      return null;
    }
    try {
      const h = await window.showDirectoryPicker({ mode: "readwrite" });
      if (!await ensurePermission(h, "readwrite")) {
        toast("لم يتم منح صلاحية الكتابة", "warn");
        return null;
      }
      dirHandle = h;
      await idbSet(KEY_DIR, h);
      updateDirInfo(`✅ <strong>المجلد المحدد:</strong> <span class="path">${h.name}</span>`);
      toast("✅ تم اختيار المجلد: " + h.name, "ok");
      return h;
    } catch (e) {
      if (e.name !== "AbortError") toast("خطأ: " + e.message, "err");
      return null;
    }
  }

  pickDirBtn.addEventListener("click", pickDirectory);

  async function restoreDirectory() {
    if (!hasDirPicker()) {
      updateDirInfo(`⚠️ متصفحك لا يدعم <b>showDirectoryPicker</b> — سيُستخدم التنزيل العادي.`, "warn");
      return;
    }
    try {
      const saved = await idbGet(KEY_DIR);
      if (!saved) {
        updateDirInfo(`📁 لم يتم اختيار مجلد — اضغط <b>📁</b> لاختيار مجلد الحفظ`);
        return;
      }
      dirHandle = saved;
      if ((await saved.queryPermission({ mode: "readwrite" })) === "granted") {
        updateDirInfo(`✅ <strong>المجلد المحفوظ:</strong> <span class="path">${saved.name}</span>`);
      } else {
        updateDirInfo(`📁 <strong>مجلد محفوظ:</strong> <span class="path">${saved.name}</span> — سيُطلب التأكيد عند الحفظ`);
      }
    } catch (e) {
      updateDirInfo(`📁 لم يتم اختيار مجلد بعد`);
    }
  }

  function updateDirInfo(html, cls = "") {
    dirInfo.className = "dir-info " + cls;
    dirInfo.innerHTML = html;
  }

  // ============================================================
  //  العدّاد
  // ============================================================
  function getCounter() { return parseInt(localStorage.getItem(KEY_COUNTER) || "0", 10); }
  function setCounter(n) { localStorage.setItem(KEY_COUNTER, String(n)); }

  // ============================================================
  //  بناء اسم الملف: Vk.cookies{N}.json
  // ============================================================
  function buildFileName(prefix, n) {
    let p = (prefix || DEFAULT_PREFIX).trim();
    // إزالة أي امتداد أو رموز غير مرغوبة
    p = p.replace(/\.json$/i, "").replace(/\.cookies\d*$/i, "").trim();
    if (!p) p = DEFAULT_PREFIX;
    return `${p}.cookies${n}.json`;
  }

  // ============================================================
  //  الحفظ
  // ============================================================
  async function doSave() {
    const raw = cookieInput.value.trim();
    if (!raw) { toast("⚠️ صندوق الكوكيز فارغ", "warn"); return; }

    let jsonText = raw;
    try {
      jsonText = JSON.stringify(JSON.parse(raw), null, 2);
    } catch {
      if (!confirm("الكود ليس JSON صالحاً. حفظه كنص خام؟")) return;
    }

    const prefix = folderInput.value.trim() || DEFAULT_PREFIX;
    saveBtn.disabled = true;
    setStatus("جارٍ الحفظ...", "idle");

    try {
      if (hasDirPicker()) {
        if (!dirHandle) {
          const picked = await pickDirectory();
          if (!picked) throw new Error("لم يتم اختيار مجلد");
        } else if (!await ensurePermission(dirHandle, "readwrite")) {
          const picked = await pickDirectory();
          if (!picked) throw new Error("لم يتم منح الصلاحية");
        }

        const next = getCounter() + 1;
        const fileName = buildFileName(prefix, next);
        const fh = await dirHandle.getFileHandle(fileName, { create: true });
        const w  = await fh.createWritable();
        await w.write(jsonText);
        await w.close();
        setCounter(next);

        setStatus(`✅ ${dirHandle.name}/${fileName}`, "ok");
        toast(`✅ تم الحفظ: ${fileName}`, "ok");
        cookieInput.value = "";
        return;
      }

      // fallback — تنزيل محلي
      const next = getCounter() + 1;
      const fileName = buildFileName(prefix, next);
      const blob = new Blob([jsonText], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      setCounter(next);

      setStatus(`📥 ${fileName}`, "ok");
      toast(`✅ تم التنزيل: ${fileName}`, "ok");
      cookieInput.value = "";

    } catch (e) {
      setStatus("❌ " + e.message, "err");
      toast("❌ فشل: " + e.message, "err");
    } finally {
      saveBtn.disabled = false;
    }
  }

  saveBtn.addEventListener("click", doSave);

  function initApp() {
    restoreDirectory();
    setStatus("جاهز للتصدير", "ok");
  }

})();
</script>
</body>
</html>
